name: Auto Generate Key and Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Automatic Keystore
        run: |
          keytool -genkeypair -v \
            -keystore auto-release.jks \
            -alias auto_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AutoGeneratedPassword123 \
            -keypass AutoGeneratedPassword123 \
            -dname "CN=ShieldGuard, OU=Development, O=ShieldGuard, L=Tehran, ST=Tehran, C=IR"

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-AutoSigned-APK
          path: app/build/outputs/apk/release/*.apk
